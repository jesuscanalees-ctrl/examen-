<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./public/img/favico.png" type="image/x-icon">
    <title>Examen Unidad 4</title>
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col text-center">
                <h1 class="text-danger">Plantilla Examen Unidad 4</h1>

                <div class="mb-3">
                    <label for="regexInput" class="form-label">Expresion Regular</label>
                    <input type="text" id="regexInput" class="form-control" placeholder="Ej: ^[a-zA-Z0-9]+$">
                </div>
                <div class="mb-3">
                    <label for="textInput" class="form-label fw-bold">Texto a evaluar</label>
                    <input type="text" id="textInput" class="form-control" placeholder="Ingresa la cadena de texto">
                </div>
                <div class="d-flex gap-2">
                    <button id="btnCompare" class="btn btn-primary">Comparar</button>
                    <button id="btnClear" class="btn btn-success">Borrar</button>
                </div>
            </div>
        </div>
    </div>    
    
    <script src="./bundle.js"></script>
</body>
</html>
